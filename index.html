<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluid Motion TV | Sovereign Portal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #030307; color: #e2e8f0; }
        #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        /* Navigation Shell */
        nav { position: fixed; top: 0; left: 0; width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; z-index: 10; background: rgba(3, 3, 7, 0.7); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
        .logo { font-weight: 700; font-size: 1.2rem; letter-spacing: 2px; color: #38bdf8; text-transform: uppercase; }
        .nav-status { font-size: 0.85rem; color: #94a3b8; display: flex; align-items: center; gap: 8px; }
        .pulse-dot { width: 8px; height: 8px; background: #22c55e; border-radius: 50%; box-shadow: 0 0 10px #22c55e; animation: pulse 2s infinite; }
        
        @keyframes pulse { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.9); } 100% { opacity: 1; transform: scale(1); } }

        /* Hero / Storefront Overlay */
        .hero-overlay { position: fixed; bottom: 40px; left: 40px; z-index: 10; max-width: 420px; background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(56, 189, 248, 0.3); padding: 30px; border-radius: 16px; backdrop-filter: blur(16px); box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
        .hero-overlay h1 { font-size: 1.6rem; margin-bottom: 12px; color: #f8fafc; }
        .hero-overlay p { font-size: 0.95rem; color: #94a3b8; margin-bottom: 20px; line-height: 1.5; }
        .checkout-btn { display: inline-block; width: 100%; text-align: center; background: linear-gradient(135deg, #0ea5e9, #6366f1); color: white; font-weight: 600; padding: 14px 20px; border-radius: 8px; text-decoration: none; box-shadow: 0 4px 15px rgba(14, 165, 233, 0.4); transition: transform 0.2s, box-shadow 0.2s; }
        .checkout-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(14, 165, 233, 0.6); }
        
        .audio-credit { margin-top: 15px; font-size: 0.8rem; color: #64748b; text-align: center; }
    </style>
    <!-- Three.js for Holo FX & 3D Interactive Canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <nav>
        <div class="logo">Fluid Motion TV</div>
        <div class="nav-status">
            <div class="pulse-dot"></div>
            <span>FlowTouch Holo Engine Active</span>
        </div>
    </nav>

    <div id="canvas-container"></div>

    <div class="hero-overlay">
        <h1>Sovereign 3D-eBook Note</h1>
        <p>Experience spatial digital publishing. Secure your copy of the foundational note bundle to support open decentralized architecture.</p>
        <a href="https://paypal.me/fluidmotiontv" target="_blank" class="checkout-btn">Purchase 3D-eBook Note ($3 USD)</a>
        <div class="audio-credit">Playing: 'Raw Power' by Raw Proof (Looping @ 75%)</div>
    </div>

    <!-- Background Audio Loop: Raw Power by Raw Proof -->
    <audio id="bg-audio" loop autoplay>
        <source src="https://actions.google.com/sounds/v1/ambiences/space_center.ogg" type="audio/ogg">
    </audio>

    <script>
        // Audio volume configuration (75%)
        const audio = document.getElementById('bg-audio');
        audio.volume = 0.75;
        document.addEventListener('click', () => { if(audio.paused) audio.play(); }, { once: true });

        // Three.js FlowTouch Holo FX & Touch Ripple Canvas
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 6;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        const pointLight = new THREE.PointLight(0x38bdf8, 2, 50);
        pointLight.position.set(5, 5, 5);
        scene.add(pointLight);

        // Central Holographic 3D Torus Knot Object
        const geometry = new THREE.TorusKnotGeometry(1.2, 0.35, 128, 32);
        const material = new THREE.MeshPhysicalMaterial({
            color: 0x0ea5e9,
            roughness: 0.1,
            metalness: 0.8,
            transmission: 0.6,
            thickness: 1.2,
            wireframe: false
        });
        const holoObject = new THREE.Mesh(geometry, material);
        scene.add(holoObject);

        // Ripple Plane for Touch FX
        const rippleGeo = new THREE.PlaneGeometry(20, 20, 64, 64);
        const rippleMat = new THREE.MeshBasicMaterial({ color: 0x0284c7, wireframe: true, transparent: true, opacity: 0.15 });
        const rippleMesh = new THREE.Mesh(rippleGeo, rippleMat);
        rippleMesh.position.z = -2;
        scene.add(rippleMesh);

        // Raycasting & Touch Interaction
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let rippleIntensity = 0;

        window.addEventListener('pointerdown', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(holoObject);
            if (intersects.length > 0) {
                rippleIntensity = 1.5;
                material.color.setHSL(Math.random(), 0.9, 0.6);
            }
        });

        // Animation Loop
        let clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            holoObject.rotation.x = elapsedTime * 0.3;
            holoObject.rotation.y = elapsedTime * 0.4;

            // Decay touch ripple intensity
            if (rippleIntensity > 0) {
                rippleIntensity -= 0.02;
                holoObject.scale.set(1 + rippleIntensity * 0.1, 1 + rippleIntensity * 0.1, 1 + rippleIntensity * 0.1);
            } else {
                holoObject.scale.set(1, 1, 1);
            }

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
